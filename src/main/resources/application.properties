# Server
server.port=8080

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql on startup (creates the students table if it doesn't exist)
spring.sql.init.mode=always

# Logging
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.example.studentmanagement=DEBUG
